# This workflow builds, tests, and packages the plugin in the build job,
# then publishes the verified dist/ artifact to npm and attaches the ZIP to the GitHub Release.

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Build zip
        run: npm run build:zip

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist
            *.zip
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: publish-cicd

    permissions:
      id-token: write
      contents: write
      attestations: write
      packages: read

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .

      - name: Publish to npm
        run: npm publish ./dist --provenance --access public

      - name: Upload zip to release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
